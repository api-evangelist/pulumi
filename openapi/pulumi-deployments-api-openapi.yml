      summary: GetDeployment
      tags:
      - Deployments
  /api/stacks/{orgName}/{projectName}/{stackName}/deployments/{deploymentId}:
    get:
      description: Retrieves detailed information about a specific Pulumi Deployments execution by its deployment ID. The response includes the deployment's current status, creation and modification timestamps, version number, the user who requested the deployment, the Pulumi operation type (update, preview, refresh, or destroy), and detailed job information. Each job contains an array of steps with their individual statuses (not-started, running, succeeded, or failed), start times, and last update timestamps. The response also includes any associated stack update results with update IDs, versions, start/end times, and result status.
      operationId: GetDeployment
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The project name
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: The stack name
        in: path
        name: stackName
        required: true
        schema:
          type: string
      - description: The deployment identifier
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeploymentResponse'
          description: OK
        '404':
          description: Deployment
      summary: GetDeployment
      tags:
      - Deployments
  /api/stacks/{orgName}/{projectName}/{stackName}/deployments/{deploymentId}/cancel:
    post:
      description: 'Terminates an in-progress Pulumi Deployments execution for a specific stack. If the deployment is currently running, it is stopped immediately. If the deployment is queued but has not yet started, it is removed from the queue.


        **Warning:** Canceling a deployment is a dangerous action and may leave the stack in an inconsistent state if the deployment is canceled during the execution of a Pulumi operation.


        Note that this serves two endpoints:

        - /{orgName}/{projectName}/{stackName}/deployments/{deploymentId}/cancel

        - /admin/deployments/{deploymentId}/cancel


        The former requires that the requesting user has stack deployment create permissions. The latter requires that the requesting user is a site administrator.'
      operationId: CancelDeployment
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The project name
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: The stack name
        in: path
        name: stackName
        required: true
        schema:
          type: string
      - description: The deployment identifier
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: Deployment or Queued Deployment
      summary: CancelDeployment
      tags:
      - Deployments
  /api/stacks/{orgName}/{projectName}/{stackName}/deployments/{deploymentId}/logs:
    get:
      description: 'Retrieves execution logs for a Pulumi Deployments run. Supports two retrieval modes: streaming mode and step mode. In streaming mode, omit job/step parameters and use the continuationToken to incrementally fetch logs from the beginning through completion. Each response includes a nextToken field; continue requesting with this token until nextToken is absent, indicating all logs have been retrieved. In step mode, specify job and step indices to retrieve logs for a specific step within a specific job, with offset and count parameters for pagination within that step''s logs. In step mode, count must be between 1 and 499 (default 100), and the response includes a nextOffset field for fetching subsequent pages. Log lines include timestamps and the log line content.


        Note that this serves two endpoints:

        - /{orgName}/{projectName}/{stackName}/deployments/{deploymentId}/logs

        - /admin/deployments/{deploymentId}/logs


        The former requires stack deployment read permissions. The latter requires site administrator privileges.'
      operationId: GetDeploymentLogs
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The project name
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: The stack name
        in: path
        name: stackName
        required: true
        schema:
          type: string
      - description: The deployment identifier
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      - description: Continuation token for streaming logs; use nextToken from the previous response to fetch subsequent log entries
        in: query
        name: continuationToken
        schema:
          type: string
      - description: Number of log lines to return (1-499, default 100)
        in: query
        name: count
        schema:
          format: int64
          type: integer
      - description: Zero-based job index to retrieve logs for
        in: query
        name: job
        schema:
          format: int64
          type: integer
      - description: Zero-based line offset within the step logs
        in: query
        name: offset
        schema:
          format: int64
          type: integer
      - description: Zero-based step index within the specified job
        in: query
        name: step
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentLogsBase'
          description: OK
        '400':
          description: Count must be less than 500 and more than 0
        '404':
          description: Deployment or Run
      summary: GetDeploymentLogs
      tags:
      - Deployments
  /api/stacks/{orgName}/{projectName}/{stackName}/deployments/{deploymentId}/updates:
    get:
      description: Retrieves all stack updates (program updates) associated with a specific Pulumi Deployments execution. A single deployment may produce one or more stack updates depending on the operation performed. Each update in the response includes details such as the update ID, version, start and end times, result status, and resource changes. This is useful for correlating deployment executions with their resulting infrastructure changes.
      operationId: GetDeploymentUpdates
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The project name
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: The stack name
        in: path
        name: stackName
        required: true
        schema:
          type: string
      - description: The deployment identifier
        in: path
        name: deploymentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UpdateInfo'
                type: array
          description: OK
        '404':
          description: Deployment or Program
      summary: GetDeploymentUpdates
      tags:
      - Deployments
  /api/stacks/{orgName}/{projectName}/{stackName}/drift/runs:
    get:
      description: Returns a paginated list of all drift detection runs for a stack. Each drift run represents a scheduled or manually triggered drift detection execution and includes details about whether drift was detected and any remediation actions taken. Use the 'page' (minimum 1, default 1) and 'pageSize' (1-100, default 10) query parameters for pagination.
      operationId: ListDriftRuns
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The project name
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: The stack name
        in: path
        name: stackName
        required: true
        schema:
          type: string
      - description: Page number (min 1, default 1)
        in: query
        name: page
        schema:
          format: int64
          type: integer
      - description: Results per page (1-100, default 10)
        in: query
        name: pageSize
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDriftRunsResponse'
          description: OK
        '400':
          description: Invalid query parameter
      summary: ListDriftRuns
      tags:
      - Deployments
  /api/stacks/{orgName}/{projectName}/{stackName}/drift/status:
    get:
      description: Retrieves the current drift detection status and associated metadata for a stack. Drift occurs when the actual state of cloud resources diverges from the state declared in the Pulumi program. The response indicates whether drift has been detected, when the last drift check was performed, and details about any detected differences. This is used in conjunction with drift detection schedules to monitor infrastructure compliance.
      operationId: GetStackDriftStatus
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The project name
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: The stack name
        in: path
        name: stackName
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackDriftStatus'
          description: OK
      summary: GetStackDriftStatus
      tags:
      - Deployments
components:
  schemas:
    OperationContextGCPOIDCConfigurationRequest:
      description: Request body for updating the GCP OIDC configuration of an operation context.
      properties:
        projectId:
          description: The numerical ID of the GCP project.
          type: string
          x-order: 1
        providerId:
          description: The ID of the identity provider associated with the workload pool.
          type: string
          x-order: 4
        region:
          description: The region of the GCP project.
          type: string
          x-order: 2
        serviceAccount:
          description: The email address of the service account to use.
          type: string
          x-order: 5
        tokenLifetime:
          description: The lifetime of the temporary credentials.
          type: string
          x-order: 6
        workloadPoolId:
          description: The ID of the workload pool to use.
          type: string
          x-order: 3
      type: object
    AppUpdateInfo:
      description: 'UpdateInfo describes a previous update.

        Should generally mirror backend.UpdateInfo, but we clone it in this package to add

        flexibility in case there is a breaking change in the backend-type.'
      properties:
        config:
          additionalProperties:
            $ref: '#/components/schemas/AppConfigValue'
          description: Stack configuration values used during the update, keyed by config key.
          type: object
          x-order: 5
        deployment:
          description: Raw deployment state snapshot, if requested.
          type: object
          x-order: 9
        endTime:
          description: Unix epoch timestamp (seconds) when the update completed.
          format: int64
          type: integer
          x-order: 7
        environment:
          additionalProperties:
            type: string
          description: Environment variables that were set during the update, keyed by variable name.
          type: object
          x-order: 4
        kind:
          description: Information known before an update is started.
          enum:
          - update
          - preview
          - refresh
