  /api/orgs/{orgName}/members:
    get:
      description: "ListOrganizationMembers lists the members of an organization. This API unfortunately has two different\n\"modes\", returning either the organization's \"frontend members\" or \"backend members\".\n\n  - A \"frontend member\" is data stored in the Pulumi Service's database. For organizations billed\n    per-member, this is the set of members that are counted against the organization's seat cap.\n  - A \"backend member\" is data stored in the organization's backend. (e.g. GitHub, GitLab, or for SAML\n    orgs, also the Pulumi Service database.)\n\nThis isn't ideal, but is required so that the APIs can be paginated correctly while not returning any\nusers twice. (Which would be impossible in some cases.)"
      operationId: ListOrganizationMembers
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: Token for paginated result retrieval
        in: query
        name: continuationToken
        schema:
          type: string
      - description: 'Member type to list: ''frontend'' for Pulumi Service members or ''backend'' for organization backend members'
        in: query
        name: type
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationMembersResponse'
          description: OK
        '400':
          description: invalid query parameter
      summary: ListOrganizationMembers
      tags:
      - Organizations
  /api/orgs/{orgName}/members/{userLogin}:
    delete:
      description: Removes a user from an organization. The removed user loses access to all organization resources including stacks, teams, and projects. The caller cannot remove themselves from the organization. The user is also removed from all teams they belong to within the organization.
      operationId: DeleteOrganizationMember
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The user login name
        in: path
        name: userLogin
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: You cannot remove yourself from the organization.
        '404':
          description: User
      summary: DeleteOrganizationMember
      tags:
      - Organizations
    patch:
      description: Modifies a user's role within an organization. Set `role` to assign a built-in role (`member`, `admin`, or `billingManager`), or set `fgaRoleId` to assign a custom role. If both are provided, `fgaRoleId` takes precedence.
      operationId: UpdateOrganizationMember
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The user login name
        in: path
        name: userLogin
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationMemberRequest'
        x-originalParamName: body
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid parameter 'roleID'.
        '404':
          description: User
      summary: UpdateOrganizationMember
      tags:
      - Organizations
    post:
      description: 'Adds an existing Pulumi user to an organization with a built-in role. **Important:** The user must have already signed up for a Pulumi account before they can be added to an organization.


        This endpoint only assigns built-in roles. To onboard a user with a custom role, use the organization invite flow (`BatchCreateOrgInviteEmail`) and set `roleId` on the invite — the custom role is applied when the user accepts. Alternatively, add the user here with a built-in role and then call `UpdateOrganizationMember` with `fgaRoleId` to reassign.


        Returns the newly created organization member record. Returns 409 if the user is already a member of the organization.'
      operationId: AddOrganizationMember
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The user login name
        in: path
        name: userLogin
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationMemberRequest'
        x-originalParamName: body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
          description: OK
        '400':
          description: Invalid organization role.
        '404':
          description: User
        '409':
          description: User is already an organization member.
      summary: AddOrganizationMember
      tags:
      - Organizations
  /api/orgs/{orgName}/members/{userLogin}/set-admin:
    post:
      description: 'Promotes a member to administrator on organizations that are limited to a single admin. This endpoint is only valid for Team subscriptions (Team Starter and Team Growth) — it returns 400 on any other plan. On these plans, `UpdateOrganizationMember` cannot promote a member to admin, because doing so would require simultaneously demoting the current admin. This endpoint performs both changes atomically: the caller (who must be the current sole admin) is demoted to member and the target user is promoted to admin.


        **Note:** This endpoint operates on built-in roles only and does not integrate with custom roles.'
      operationId: SetSoleOrganizationAdmin
      parameters:
      - description: The organization name
        in: path
        name: orgName
        required: true
        schema:
          type: string
      - description: The user login name
        in: path
        name: userLogin
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Wrong API. Use the regular update Pulumi organization member endpoint instead.
        '404':
          description: User
      summary: SetSoleOrganizationAdmin
      tags:
      - Organizations
  /api/orgs/{orgName}/metadata:
